<!doctype html><html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vehicle | Get A Bus NY</title><!--OG--><meta name="theme-color" content="#0d1b26"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&family=VT323&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/site.css"></head><body><div id="hdr"></div><main id="main">
<div class="pagehead"><div class="wrap"><p style="margin:0 0 8px"><a href="/fleet">&larr; All vehicles</a></p><h1 id="t">Vehicle</h1></div></div>
<section><div class="wrap" id="box"><p class="muted">Loading...</p></div></section>
</main><div id="ftr"></div>
<script type="module">
import {boot,api,vehicleArt,seatMap,shareButton,$,esc} from '/js/site.js';
await boot('/fleet');
const m=location.pathname.match(/\/bus\/(\d+)/)||[null,new URLSearchParams(location.search).get('id')];
const id=parseInt(m[1],10);
const box=$('#box');
function nf(){document.title='Vehicle not found | Get A Bus NY';$('#t').textContent='We could not find that vehicle';box.innerHTML='<p class="muted">It may have been removed from the fleet.</p><a class="btn btn-blue" href="/fleet">See the fleet</a> <a class="btn btn-line" href="/book">Request a quote</a>';}
if(!id)nf();else try{
 const v=await api('/vehicle/'+id);
 document.title=`${v.name} | Get A Bus NY`;$('#t').textContent=v.name;
 const imgs=(v.images&&v.images.length)?v.images:(v.image?[v.image]:[]);
 const many=imgs.length>1;
 const pic=imgs.length?`<div class="frame" id="frame"><img id="mainpic" src="${esc(imgs[0])}" alt="${esc(v.name)}">${many?`<button type="button" class="sl-nav prev" id="gprev" aria-label="Previous photo">&#8249;</button><button type="button" class="sl-nav next" id="gnext" aria-label="Next photo">&#8250;</button><span class="count" id="gcount">1 / ${imgs.length}</span>`:''}</div>${many?`<div class="thumbs" role="group" aria-label="More photos">${imgs.map((u,i)=>`<button type="button" class="th${i?'':' on'}" data-u="${esc(u)}" aria-label="Photo ${i+1} of ${imgs.length}"><img src="${esc(u)}" alt="" loading="lazy"></button>`).join('')}</div><p style="margin:12px 0 0"><button type="button" class="btn btn-line" id="morepics">View more photos (${imgs.length})</button></p>`:''}<p class="photonote" data-note>Photos are for viewing only. They are not a guarantee of the exact vehicle for your trip.</p>`:vehicleArt(v.category,v.capacity,{label:v.name});
 box.innerHTML=`<div class="busdetail"><div class="art">${pic}</div><div>
  <span class="tag">${esc(v.category)}</span>
  <div class="big" style="margin-top:14px"><small>SEATS</small>${v.capacity}</div>
  <div class="seatmap">${seatMap(v.capacity)}</div>
  <p>${esc(v.description||'')}</p>
  ${(v.features||[]).length?`<h3>Features</h3><ul class="checks" style="columns:1">${v.features.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
  <p class="muted" style="margin-top:14px">Pricing is quoted by hand for each trip.</p>
  <div class="foot" style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn btn-blue" href="/book?vehicle=${v.id}">Request a quote</a>${shareButton(v,'btn btn-line')}</div>
 </div></div>`;

 if(many){
  const ths=[...document.querySelectorAll('.thumbs .th')],main=$('#mainpic'),cnt=$('#gcount');let cur=0,tm=null,sx=null;
  const pick=k=>{cur=(k+imgs.length)%imgs.length;main.src=imgs[cur];cnt.textContent=`${cur+1} / ${imgs.length}`;ths.forEach((x,j)=>x.classList.toggle('on',j===cur));ths[cur]?.scrollIntoView({block:'nearest',inline:'nearest'});};
  const stop=()=>{clearInterval(tm);tm=null;};
  const go=d=>{stop();pick(cur+d);};
  $('#gprev').onclick=()=>go(-1);$('#gnext').onclick=()=>go(1);
  ths.forEach((t,k)=>t.onclick=()=>{stop();pick(k);});
  const fr=$('#frame');
  fr.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')sx=e.clientX;});
  fr.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>40)go(dx<0?1:-1);});
  fr.addEventListener('mouseenter',stop);
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches)tm=setInterval(()=>{if(!document.hidden)pick(cur+1);},4000);
  // full-screen viewer: View more photos
  $('#morepics').onclick=()=>openViewer(cur);
  fr.style.cursor='zoom-in';fr.addEventListener('click',e=>{if(e.target.closest('.sl-nav'))return;openViewer(cur);});
  function openViewer(start){
   stop();let i=start;const prevFocus=document.activeElement;
   const ov=document.createElement('div');ov.className='lbx';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label',`${v.name} photos`);
   ov.innerHTML=`<button type="button" class="lbx-x" aria-label="Close">&times;</button><button type="button" class="lbx-n prev" aria-label="Previous photo">&#8249;</button><div class="lbx-stage"><img alt="${esc(v.name)}"></div><button type="button" class="lbx-n next" aria-label="Next photo">&#8250;</button><div class="lbx-bar"><span class="lbx-c"></span><div class="lbx-t">${imgs.map((u,k)=>`<button type="button" data-k="${k}" aria-label="Photo ${k+1}"><img src="${esc(u)}" alt="" loading="lazy"></button>`).join('')}</div><p>Photos are for viewing only. They are not a guarantee of the exact vehicle for your trip.</p></div>`;
   document.body.appendChild(ov);document.body.style.overflow='hidden';
   const im=ov.querySelector('.lbx-stage img'),c=ov.querySelector('.lbx-c'),tb=[...ov.querySelectorAll('.lbx-t button')];
   const show=k=>{i=(k+imgs.length)%imgs.length;im.src=imgs[i];c.textContent=`${i+1} / ${imgs.length}`;tb.forEach((x,j)=>x.classList.toggle('on',j===i));tb[i].scrollIntoView({block:'nearest',inline:'center'});};
   const close=()=>{ov.remove();document.body.style.overflow='';document.removeEventListener('keydown',key);pick(i);prevFocus?.focus?.();};
   const key=e=>{if(e.key==='Escape')close();else if(e.key==='ArrowLeft')show(i-1);else if(e.key==='ArrowRight')show(i+1);else if(e.key==='Tab'){const f=[...ov.querySelectorAll('button')];const a=document.activeElement;if(e.shiftKey&&a===f[0]){e.preventDefault();f[f.length-1].focus();}else if(!e.shiftKey&&a===f[f.length-1]){e.preventDefault();f[0].focus();}}};
   document.addEventListener('keydown',key);
   ov.querySelector('.lbx-x').onclick=close;ov.querySelector('.prev').onclick=()=>show(i-1);ov.querySelector('.next').onclick=()=>show(i+1);
   tb.forEach(t=>t.onclick=()=>show(+t.dataset.k));
   ov.addEventListener('click',e=>{if(e.target===ov||e.target.classList.contains('lbx-stage'))close();});
   let x0=null;ov.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')x0=e.clientX;});ov.addEventListener('pointerup',e=>{if(x0==null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)>50)show(i+(dx<0?1:-1));});
   show(i);ov.querySelector('.lbx-x').focus();
  }
 }
}catch{nf();}
</script></body></html>
