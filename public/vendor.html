<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Quote Request | Get A Bus NY</title><link rel="icon" href="/img/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=VT323&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/site.css">
<style>.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 20px}.kv dt{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}.kv dd{margin:2px 0 0;font-weight:600}@media(max-width:560px){.kv{grid-template-columns:1fr}}</style></head><body><div id="hdr"></div><main id="main">
<section style="padding-top:40px"><div class="wrap narrow"><div id="view" hidden>
<div class="eyebrow">Vendor quote request</div><h1 style="font-size:2rem" id="t"></h1><p class="muted" id="hi"></p>
<div class="card"><dl class="kv" id="kv"></dl><p id="msg" class="muted" style="margin:16px 0 0"></p></div>
<div id="done" class="alert ok" hidden></div>
<form id="f" class="card" style="margin-top:20px"><h3>Your response</h3>
<div class="row"><div class="field"><label for="pr">Total price (USD) *</label><input id="pr" type="number" step="0.01" min="1" required placeholder="e.g. 1850"></div><div class="field"><label for="vh">Vehicle you'd send</label><input id="vh" placeholder="e.g. 2019 MCI J4500, 56 pax"></div></div>
<div class="field"><label for="nt">Notes</label><textarea id="nt" placeholder="What's included (fuel, tolls, driver gratuity), overtime rate, anything we should know."></textarea></div>
<div id="err" class="alert err" hidden></div>
<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-lime">Send my price</button><button type="button" class="btn btn-line" id="dec">Can't do this trip</button></div></form>
</div><div id="nf" class="card center" hidden><h2>Request not found</h2><p class="muted">This link may be wrong or expired.</p></div></div></section>
</main><div id="ftr"></div>
<script type="module">
import {boot,api,$,esc,money,fmtWhen} from '/js/site.js';
await boot('');
const tok=location.pathname.split('/')[2];
try{const r=await api('/rfq/'+tok);$('#view').hidden=false;const t=r.trip||{};
 $('#t').textContent=`${t.passengers||'?'} passengers · ${fmtWhen(t.depart_at)}`;$('#hi').textContent=`Hi ${r.vendor?.contact_name||r.vendor?.name||''} - ${r.business} would like your price for this trip. Reference ${r.ref}.`;
 $('#kv').innerHTML=`<div style="grid-column:1/-1"><dt>Itinerary (in order)</dt><dd style="font-weight:500">${(t.itinerary&&t.itinerary.length?t.itinerary.filter(x=>x.kind!=='start'&&x.kind!=='end'):[{kind:'pickup',address:t.pickup},{kind:'dropoff',address:t.dropoff}]).map((x,i)=>`${i+1}. <span class="muted">${({pickup:'Pickup',stop:'Stop',dropoff:'Drop-off',return_pickup:'Return pickup'})[x.kind]||x.kind}</span> ${esc(x.address||'')}${x.time?` <span class="muted">@ ${fmtWhen(x.time)}</span>`:''}${x.wait_min?` <span class="muted">(wait ${x.wait_min} min)</span>`:''}`).join('<br>')}</dd></div>${t.purpose?`<div><dt>Trip</dt><dd>${esc(t.purpose)}</dd></div>`:''}<div><dt>Depart</dt><dd>${fmtWhen(t.depart_at)}</dd></div><div><dt>Return</dt><dd>${fmtWhen(t.return_at)}</dd></div><div><dt>Passengers</dt><dd>${t.passengers||'-'}</dd></div><div><dt>Vehicle wanted</dt><dd>${esc(t.vehicle||'Any suitable')}</dd></div>${t.stops?`<div><dt>Stops</dt><dd>${esc(t.stops)}</dd></div>`:''}${t.notes?`<div style="grid-column:1/-1"><dt>Notes</dt><dd style="font-weight:400">${esc(t.notes)}</dd></div>`:''}`;
 $('#msg').textContent=r.message||'';
 const lock=(txt)=>{$('#f').hidden=true;$('#done').textContent=txt;$('#done').hidden=false;};
 if(r.status==='responded')lock(`You quoted ${money(r.price_cents)}. We'll be in touch if we'd like to proceed. You can still update your price below.`),$('#f').hidden=false;
 if(r.status==='declined')lock('You declined this request. Thanks for letting us know.');
 if(r.status==='accepted')lock('Good news, this trip was awarded to you. We will follow up with details.');
 if(r.status==='closed')lock('This request has been closed. Thanks for responding.');
 $('#f').onsubmit=async e=>{e.preventDefault();try{await api('/rfq/'+tok,{body:{price:$('#pr').value,vehicle:$('#vh').value,notes:$('#nt').value}});lock('Thanks, your price was sent.');}catch(x){$('#err').textContent=x.message;$('#err').hidden=false;}};
 $('#dec').onclick=async()=>{if(!confirm('Decline this trip?'))return;try{await api('/rfq/'+tok,{body:{action:'decline',notes:$('#nt').value}});lock('Declined. Thanks for letting us know.');}catch(x){$('#err').textContent=x.message;$('#err').hidden=false;}};
}catch(e){$('#nf').hidden=false;}
</script></body></html>
