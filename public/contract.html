<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Agreement | Get A Bus NY</title><link rel="icon" href="/img/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/site.css">
<style>table.inv{width:100%;border-collapse:collapse}table.inv th{text-align:left;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);padding:8px 0;border-bottom:2px solid var(--line)}table.inv td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}table.inv .r{text-align:right;white-space:nowrap}.tot td{border:0;padding:4px 0}.big td{font:700 1.2rem var(--head)}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 20px;margin:16px 0}.kv dt{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}.kv dd{margin:2px 0 0;font-weight:600}@media(max-width:560px){.kv{grid-template-columns:1fr}}
.stops{list-style:none;padding:0;margin:0}.stops li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.stops b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:.8rem}.stops small{display:block;color:var(--ink-2)}
.terms li{margin:.4em 0;font-size:.93rem}
canvas#sig{width:100%;height:160px;border:2px dashed var(--line);border-radius:10px;background:#fff;cursor:crosshair;display:block}</style></head><body><div id="hdr"></div><main id="main">
<section style="padding-top:40px"><div class="wrap narrow"><div id="view" hidden>
<div id="banner" class="alert ok" hidden></div>
<div class="card"><div class="eyebrow" style="margin:0">Charter agreement</div><h1 style="font-size:2rem;margin:0" id="num"></h1><p class="muted" id="hi" style="margin:4px 0 0"></p>
<dl class="kv" id="kv"></dl>
<h3 style="margin-top:20px">Itinerary</h3><ol class="stops" id="stops"></ol>
<h3 style="margin-top:22px">Price</h3><table class="inv"><thead><tr><th>Description</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Amount</th></tr></thead><tbody id="items"></tbody></table><table class="inv"><tbody class="tot" id="tots"></tbody></table>
<h3 style="margin-top:22px">Terms</h3><ol class="terms" id="terms"></ol><p class="hint">Full terms: <a href="/terms" target="_blank">Terms &amp; Conditions</a>.</p></div>
<form class="card noprint" id="sf" style="margin-top:20px"><h3>Sign this agreement</h3>
<div class="field"><label for="nm">Type your full legal name</label><input id="nm" autocomplete="name" required></div>
<div class="field"><label>Draw your signature <button type="button" class="btn btn-line btn-sm" id="clr" style="margin-left:8px">Clear</button></label><canvas id="sig" aria-label="Signature pad"></canvas><p class="hint">Use your finger or mouse.</p></div>
<label style="font-weight:400;display:flex;gap:10px;align-items:flex-start"><input type="checkbox" id="ag" style="width:auto;min-height:0;margin-top:5px"><span>I have read this agreement and the Terms &amp; Conditions. I agree to sign electronically and understand my electronic signature is legally binding.</span></label>
<div id="err" class="alert err" hidden></div><button class="btn btn-lime" id="go" style="width:100%;margin-top:12px;font-size:1.1rem">Sign agreement</button></form>
<p class="center noprint" id="after" hidden></p>
</div><div id="nf" class="card center" hidden><h2>Agreement not found</h2><p class="muted">This link may be wrong. Please call us.</p></div></div></section>
</main><div id="ftr"></div>
<script type="module">
import {boot,api,$,esc,money,fmtWhen} from '/js/site.js';
import {signaturePad} from '/js/sigpad.js';
const KL={start:'Bus starts at',pickup:'Pickup',stop:'Stop',dropoff:'Drop-off',return_pickup:'Return pickup',end:'Bus ends at'};
await boot('');
const tok=location.pathname.split('/')[2];
try{const k=await api('/contract/'+tok);$('#view').hidden=false;
 $('#num').textContent=k.number;$('#hi').textContent=`Between ${k.business.name} and ${k.customer.name}${k.customer.company?' ('+k.customer.company+')':''}`;
 const t=k.trip||{};
 $('#kv').innerHTML=`<div><dt>Trip</dt><dd>${esc(t.purpose||'Charter')}</dd></div><div><dt>Passengers</dt><dd>${t.passengers||'—'}</dd></div><div><dt>Departure</dt><dd>${fmtWhen(t.depart_at)}</dd></div><div><dt>Return</dt><dd>${fmtWhen(t.return_at)}</dd></div><div><dt>Vehicle</dt><dd>${esc(t.vehicle||'To be confirmed')}</dd></div><div><dt>Deposit to book</dt><dd>${money(k.deposit_cents)} (${k.deposit_pct}%)</dd></div>`;
 $('#stops').innerHTML=(k.itinerary||[]).filter(x=>x.kind!=='start'&&x.kind!=='end').map((x,i)=>`<li><b>${i+1}</b><div>${esc(x.address)}<small>${KL[x.kind]}${x.time?' · '+fmtWhen(x.time):''}${x.wait_min?' · wait '+x.wait_min+' min':''}${x.note?' · '+esc(x.note):''}</small></div></li>`).join('')||'<li>See quote.</li>';
 $('#items').innerHTML=(k.items||[]).filter(x=>x.qty&&x.unit_cents).map(x=>`<tr><td>${esc(x.desc)}</td><td class="r">${x.qty}</td><td class="r">${money(x.unit_cents)}</td><td class="r">${money(Math.round(x.qty*x.unit_cents))}</td></tr>`).join('');
 $('#tots').innerHTML=`<tr><td colspan="3" class="r">Subtotal</td><td class="r">${money(k.subtotal_cents)}</td></tr>${k.tax_cents?`<tr><td colspan="3" class="r">Tax (${k.tax_rate}%)</td><td class="r">${money(k.tax_cents)}</td></tr>`:''}<tr class="big"><td colspan="3" class="r">Total</td><td class="r">${money(k.total_cents)}</td></tr>`;
 $('#terms').innerHTML=(k.terms||[]).map(x=>`<li>${esc(x)}</li>`).join('');
 const b=$('#banner');
 if(k.status==='signed'){b.hidden=false;b.innerHTML=`Signed by <b>${esc(k.signer_name)}</b> on ${new Date(k.signed_at).toLocaleString()}. <a href="/api/public/contract/${tok}/pdf" target="_blank"><b>Download signed PDF</b></a>`;$('#sf').hidden=true;}
 else if(k.status==='void'){b.className='alert err';b.hidden=false;b.textContent='This agreement is no longer valid. Please contact us.';$('#sf').hidden=true;}
 else{const pad=signaturePad($('#sig'));$('#clr').onclick=()=>pad.clear();
  $('#sf').onsubmit=async e=>{e.preventDefault();const err=$('#err');err.hidden=true;const sig=pad.get();
   if(!$('#nm').value.trim()||!sig||!$('#ag').checked){err.textContent='Type your name, draw your signature and check the box.';err.hidden=false;return;}
   const g=$('#go');g.disabled=true;g.textContent='Signing…';
   try{const r=await api('/contract/'+tok+'/sign',{body:{name:$('#nm').value,signature:sig,agree:true}});
    $('#sf').hidden=true;b.hidden=false;b.className='alert ok';b.innerHTML=`Signed. A copy was emailed to you. ${r.invoice_token?`<a href="/pay/${r.invoice_token}"><b>Continue to your invoice →</b></a>`:''}`;window.scrollTo({top:0,behavior:'smooth'});
   }catch(x){err.textContent=x.message;err.hidden=false;g.disabled=false;g.textContent='Sign agreement';}};}
}catch(e){$('#nf').hidden=false;}
</script></body></html>
