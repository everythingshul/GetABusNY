services:
  - type: web
    name: getabusny
    env: node
    plan: starter            # needs a persistent disk, so not the free plan
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: getabusny-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: NODE_ENV, value: production }
      - { key: DB_PATH, value: /data/getabusny.db }
      - { key: DATA_DIR, value: /data }
      - { key: UPLOAD_DIR, value: /data/uploads }
      - { key: BASE_URL, value: "https://getabusny.com" }
      - { key: ADMIN_EMAIL, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
      - { key: SESSION_SECRET, generateValue: true }
      - { key: STRIPE_SECRET_KEY, sync: false }
      - { key: STRIPE_WEBHOOK_SECRET, sync: false }
      - { key: STRIPE_PUBLISHABLE_KEY, sync: false }
      - { key: BREVO_API_KEY, sync: false }
      - { key: EMAIL_FROM, sync: false }          # e.g. Get A Bus NY <quotes@getabusny.com>
      - { key: GOOGLE_MAPS_API_KEY, sync: false }
      - { key: CHESKY_API_KEY, sync: false }
      - { key: SMS_API_BASE, sync: false }
      - { key: SMS_API_KEY, sync: false }
      - { key: HERE_API_KEY, sync: false }
      - { key: FMCSA_WEBKEY, sync: false }
      - { key: OPENAI_API_KEY, sync: false }
